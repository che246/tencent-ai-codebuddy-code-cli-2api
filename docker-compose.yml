services:
  codebuddy-gateway:
    build: .
    container_name: codebuddy-gateway
    restart: unless-stopped
    ports:
      - "8317:8317"
    volumes:
      - ./config.json:/app/config.json
      - ./accounts.json:/app/accounts.json
      - ./stats.json:/app/stats.json
      - ./gateway.log:/app/gateway.log
